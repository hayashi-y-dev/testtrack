services:
  db:
    image: postgres:16
    container_name: testtrack-db
    environment:
      POSTGRES_DB: testtrack
      POSTGRES_USER: testtrack
      POSTGRES_PASSWORD: testtrack
    ports:
      - "5432:5432"
    volumes:
      - testtrack-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  testtrack-db-data:
