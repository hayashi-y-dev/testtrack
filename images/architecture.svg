<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,'Noto Sans JP','Noto Sans CJK JP',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 背景（GitHubのダークモードでも読めるように白で塗る） -->
  <rect x="0" y="0" width="980" height="400" rx="12" fill="#ffffff"/>

  <!-- AWS -->
  <rect x="370" y="20" width="590" height="360" rx="10" fill="#fff8ef" stroke="#ff9900" stroke-width="1.5"/>
  <text x="386" y="44" font-size="14" font-weight="bold" fill="#b45309">AWS</text>

  <!-- EC2 -->
  <rect x="390" y="100" width="550" height="124" rx="8" fill="#ffffff" stroke="#ff9900" stroke-width="1.5"/>
  <text x="406" y="124" font-size="13" font-weight="bold" fill="#b45309">EC2（t3.micro）</text>

  <!-- ノード -->
  <g font-size="14" fill="#111827" text-anchor="middle">
    <rect x="20" y="150" width="120" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="80" y="183">ブラウザ</text>

    <rect x="185" y="150" width="150" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="260" y="174">Tailscale Funnel</text>
    <text x="260" y="194" font-size="12" fill="#4b5563">公開URL・HTTPS</text>

    <rect x="410" y="150" width="130" height="56" rx="8" fill="#0FA07C" stroke="#0FA07C"/>
    <text x="475" y="174" fill="#ffffff" font-weight="bold">Next.js</text>
    <text x="475" y="194" font-size="12" fill="#E6F6F1">画面</text>

    <rect x="600" y="150" width="130" height="56" rx="8" fill="#0FA07C" stroke="#0FA07C"/>
    <text x="665" y="174" fill="#ffffff" font-weight="bold">NestJS</text>
    <text x="665" y="194" font-size="12" fill="#E6F6F1">API</text>

    <rect x="790" y="150" width="130" height="56" rx="8" fill="#0FA07C" stroke="#0FA07C"/>
    <text x="855" y="174" fill="#ffffff" font-weight="bold">PostgreSQL</text>
    <text x="855" y="194" font-size="12" fill="#E6F6F1">Docker</text>

    <rect x="395" y="300" width="180" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="485" y="324">EventBridge Scheduler</text>
    <text x="485" y="344" font-size="12" fill="#4b5563">月〜金 9時起動・18時停止</text>

    <rect x="600" y="300" width="130" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="665" y="333">Amazon SES</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="140" y1="178" x2="183" y2="178" marker-end="url(#arrow)"/>
    <line x1="335" y1="178" x2="408" y2="178" marker-end="url(#arrow)"/>
    <line x1="540" y1="178" x2="598" y2="178" marker-end="url(#arrow)"/>
    <line x1="730" y1="178" x2="788" y2="178" marker-end="url(#arrow)"/>
    <line x1="665" y1="206" x2="665" y2="298" marker-end="url(#arrow)"/>
    <line x1="485" y1="300" x2="485" y2="226" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>

  <!-- 矢印のラベル -->
  <g font-size="12" fill="#4b5563" text-anchor="middle">
    <text x="161" y="168">HTTPS</text>
    <text x="569" y="168">/api/*</text>
    <text x="675" y="258" text-anchor="start">パスワード再設定メール</text>
    <text x="495" y="268" text-anchor="start">起動・停止</text>
  </g>
</svg>
